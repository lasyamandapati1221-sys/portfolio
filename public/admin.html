<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin</title>
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">Portfolio CMS</div>
        <div class="nav-list">
          <button type="button" class="nav-item active" data-section="dashboard">Dashboard</button>
          <button type="button" class="nav-item" data-section="personal">Personal</button>
          <button type="button" class="nav-item" data-section="about">About</button>
          <button type="button" class="nav-item" data-section="statistics">Statistics</button>
          <button type="button" class="nav-item" data-section="skills">Skills</button>
          <button type="button" class="nav-item" data-section="experience">Experience</button>
          <button type="button" class="nav-item" data-section="training">Hands-on</button>
          <button type="button" class="nav-item" data-section="projects">Projects</button>
          <button type="button" class="nav-item" data-section="certifications">Certifications</button>
          <button type="button" class="nav-item" data-section="education">Education</button>
          <button type="button" class="nav-item" data-section="social">Social</button>
          <button type="button" class="nav-item" data-section="settings">Settings</button>
          <button type="button" id="logout-button" class="nav-item logout">Logout</button>
        </div>
      </aside>

      <main class="admin-main">
        <div class="panel">
          <div class="admin-header">
            <div>
              <p class="brand" style="margin: 0 0 8px; font-size: 0.7rem;">Admin Dashboard</p>
              <h1 id="section-title">Dashboard</h1>
            </div>
            <div id="save-status" class="status-box">Not authenticated</div>
          </div>

          <div id="dashboard-panel" class="section-panel">
            <div class="dashboard-grid">
              <div class="stat-card">
                <h3>Projects</h3>
                <p id="summary-projects">0</p>
              </div>
              <div class="stat-card">
                <h3>Skills</h3>
                <p id="summary-skills">0</p>
              </div>
              <div class="stat-card">
                <h3>Certifications</h3>
                <p id="summary-certs">0</p>
              </div>
            </div>
          </div>

          <div id="login-panel" class="login-panel">
            <h1>Login</h1>
            <form id="login-form">
              <label>
                Username
                <input type="text" name="username" placeholder="admin" required />
              </label>
              <label>
                Password
                <input type="password" name="password" placeholder="Password" required />
              </label>
              <button type="submit" class="btn-primary">Login</button>
            </form>
            <div id="login-message" class="message"></div>
          </div>

          <div id="dashboard-panel-logged" class="hidden">
            <div class="admin-header">
              <div>
                <p class="brand" style="margin: 0 0 6px; font-size: 0.7rem;">Welcome</p>
                <h2 id="admin-name">Admin</h2>
              </div>
            </div>
          </div>

          <div id="dashboard-container" class="hidden">
            <div id="dashboard-panel" class="section-panel"></div>
          </div>

          <div id="personal-section" class="hidden">
            <form id="personal-form" class="form-grid">
              <label>Name<input type="text" name="name" /></label>
              <label>Title<input type="text" name="title" /></label>
              <label>Tagline<input type="text" name="tagline" /></label>
              <label>Description<textarea name="description"></textarea></label>
              <label>Email<input type="email" name="email" /></label>
              <label>Phone<input type="text" name="phone" /></label>
              <label>Location<input type="text" name="location" /></label>
              <label>GitHub URL<input type="text" name="github" /></label>
              <label>LinkedIn URL<input type="text" name="linkedin" /></label>
              <label>Profile Image Path<input type="text" name="profileImage" /></label>
              <label>Resume URL<input type="text" name="resume" /></label>
              <label>Architecture Image Path<input type="text" name="architectureImage" /></label>
            </form>
            <div class="upload-row">
              <input type="file" id="profile-upload" accept="image/*" />
              <button type="button" id="upload-profile" class="btn-secondary">Upload profile</button>
            </div>
            <div class="section-actions">
              <button type="button" id="save-personal" class="btn-primary">Save Personal</button>
              <button type="button" id="reset-personal" class="btn-secondary">Reset</button>
            </div>
          </div>

          <div id="about-section" class="hidden">
            <form id="about-form" class="form-grid">
              <label>Heading<input type="text" name="heading" /></label>
              <label>Description<textarea name="description"></textarea></label>
            </form>
            <div class="section-actions">
              <button type="button" id="save-about" class="btn-primary">Save About</button>
              <button type="button" id="reset-about" class="btn-secondary">Reset</button>
            </div>
          </div>

          <div id="statistics-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-statistic" class="btn-secondary">Add Statistic</button>
              <button type="button" id="save-statistics" class="btn-primary">Save Statistics</button>
            </div>
            <div id="statistics-list" class="list-panel"></div>
          </div>

          <div id="skills-section" class="hidden">
            <div id="skills-editor" class="list-panel"></div>
            <div class="section-actions">
              <button type="button" id="save-skills" class="btn-primary">Save Skills</button>
            </div>
          </div>

          <div id="experience-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-experience" class="btn-secondary">Add Experience</button>
              <button type="button" id="save-experience" class="btn-primary">Save Experience</button>
            </div>
            <div id="experience-list" class="list-panel"></div>
          </div>

          <div id="training-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-training" class="btn-secondary">Add Training</button>
              <button type="button" id="save-training" class="btn-primary">Save Hands-on</button>
            </div>
            <div id="training-list" class="list-panel"></div>
          </div>

          <div id="projects-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-project" class="btn-secondary">Add Project</button>
              <button type="button" id="save-projects" class="btn-primary">Save Projects</button>
            </div>
            <div id="projects-list" class="list-panel"></div>
          </div>

          <div id="certifications-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-certification" class="btn-secondary">Add Certification</button>
              <button type="button" id="save-certifications" class="btn-primary">Save Certifications</button>
            </div>
            <div id="certifications-list" class="list-panel"></div>
          </div>

          <div id="education-section" class="hidden">
            <div class="section-actions">
              <button type="button" id="add-education" class="btn-secondary">Add Education</button>
              <button type="button" id="save-education" class="btn-primary">Save Education</button>
            </div>
            <div id="education-list" class="list-panel"></div>
          </div>

          <div id="social-section" class="hidden">
            <form id="social-form" class="form-grid">
              <label>GitHub<input type="text" name="github" /></label>
              <label>LinkedIn<input type="text" name="linkedin" /></label>
              <label>Email<input type="text" name="email" /></label>
              <label>Other<input type="text" name="other" /></label>
            </form>
            <div class="section-actions">
              <button type="button" id="save-social" class="btn-primary">Save Social</button>
              <button type="button" id="reset-social" class="btn-secondary">Reset</button>
            </div>
          </div>

          <div id="settings-section" class="hidden">
            <form id="settings-form" class="form-grid">
              <label>Site Title<input type="text" name="siteTitle" /></label>
              <label>Site Description<input type="text" name="siteDescription" /></label>
              <label><input type="checkbox" name="showHero" /> Show Hero</label>
              <label><input type="checkbox" name="showProjects" /> Show Projects</label>
              <label><input type="checkbox" name="showSkills" /> Show Skills</label>
              <label><input type="checkbox" name="showCertifications" /> Show Certifications</label>
              <label><input type="checkbox" name="showContact" /> Show Contact</label>
            </form>
            <div class="section-actions">
              <button type="button" id="save-settings" class="btn-primary">Save Settings</button>
              <button type="button" id="reset-settings" class="btn-secondary">Reset</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="/js/admin.js"></script>
  </body>
</html>
