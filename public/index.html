<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cloud & DevOps portfolio" />
    <title>Lasya Mandapati | Cloud & DevOps Engineer</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  </head>
  <body>
    <div class="page-shell">
      <section id="hero-section" class="hero-section">
        <div class="hero-copy">
          <div class="eyebrow">Cloud &amp; DevOps Portfolio</div>
          <h1 id="hero-title">Loading...</h1>
          <p id="hero-tagline">Loading profile details...</p>
          <div class="hero-actions">
            <a id="resume-link" class="btn btn-primary" href="#" target="_blank" rel="noreferrer">Download Resume</a>
            <a id="contact-github" class="btn btn-secondary" href="#" target="_blank" rel="noreferrer">GitHub</a>
            <a id="contact-linkedin" class="btn btn-secondary" href="#" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>

        <div class="hero-side">
          <div class="hero-name">Lasya Mandapati</div>
          <div class="hero-avatar">
            <img id="profile-image" src="/assets/profile.jpg" alt="Lasya Mandapati" />
          </div>
        </div>
      </section>

      <section id="about-section" class="section">
        <div class="section-head">
          <h2>About</h2>
        </div>
        <div class="grid two-column">
          <div class="panel">
            <div id="about-text"></div>
          </div>
          <div class="panel stats-panel">
            <div id="stats-container"></div>
          </div>
        </div>
      </section>

      <section id="skills-section" class="section">
        <div class="section-head">
          <h2>Skills</h2>
        </div>
        <div id="skills-grid" class="skill-grid"></div>
      </section>

      <section id="projects-section" class="section">
        <div class="section-head">
          <h2>Projects</h2>
        </div>
        <div id="projects-grid" class="project-grid"></div>
      </section>

      <section id="experience-section" class="section">
        <div class="section-head">
          <h2>Experience</h2>
        </div>
        <div id="experience-list" class="timeline"></div>
      </section>

      <section id="training-section" class="section">
        <div class="section-head">
          <h2>Hands-on</h2>
        </div>
        <div id="training-list" class="training-grid"></div>
      </section>

      <section id="certifications-section" class="section">
        <div class="section-head">
          <h2>Certifications</h2>
        </div>
        <div id="certifications-list" class="cert-grid"></div>
      </section>

      <footer id="contact" class="footer-panel">
        <div class="contact-panel">
          <div>
            <h3 id="contact-name">Lasya Mandapati</h3>
            <p id="contact-title">Cloud &amp; DevOps Engineer</p>
            <p id="contact-location">Hyderabad, India</p>
          </div>
          <div class="contact-links">
            <a id="contact-email" href="mailto:hello@example.com">Email</a>
            <a id="contact-github" href="#" target="_blank" rel="noreferrer">GitHub</a>
            <a id="contact-linkedin" href="#" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
